<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Sacramento&amp;display=swap');
      .green-text-main {
        font-family: 'Caveat', 'Brush Script MT', cursive;
        fill: #2E5A36;
        font-size: 82px;
        font-weight: 700;
      }
      .pink-text-main {
        font-family: 'Sacramento', 'Brush Script MT', cursive;
        fill: #E25B8B;
        font-size: 88px;
      }
    </style>
  </defs>

  <!-- Grupo Central do Logo -->
  <g transform="translate(40, 20)">


    <!-- Texto "Elas" -->
    <text x="100" y="105" class="green-text-main">Elas</text>

    <!-- Ícone Ilutrado: Perfil das Duas Mulheres -->
    <g transform="translate(250, 40)">
      <!-- Mulher Verde (Esquerda) -->
      <path d="M 22 25 C 22 10, 42 10, 42 25 C 42 38, 30 45, 18 45 C 18 45, 12 35, 12 25 C 12 15, 22 25, 22 25 Z" fill="#2E5A36" />
      <path d="M 25 22 C 32 20, 38 28, 38 35 C 32 38, 25 35, 25 22 Z" fill="#FAD0C4" />
      
      <!-- Mulher Rosa (Direita) -->
      <path d="M 45 28 C 45 12, 68 12, 68 28 C 68 42, 52 50, 38 50 C 38 50, 32 38, 32 28 C 32 18, 45 28, 45 28 Z" fill="#E25B8B" />
      <path d="M 48 25 C 56 22, 62 30, 62 38 C 56 42, 48 38, 48 25 Z" fill="#FCE3AD" />
      
      <!-- Linhas de contorno suave -->
      <path d="M 18 45 C 25 60, 42 62, 42 62" stroke="#2E5A36" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 38 50 C 45 65, 62 65, 62 65" stroke="#E25B8B" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Texto "por Aí" -->
    <text x="165" y="175" class="pink-text-main">por Aí</text>


  </g>
</svg>